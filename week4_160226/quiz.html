<!DOCTYPE html>
<html>
<head>
  <title>Smart Quiz Platform + Admin Panel</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial;
      background: linear-gradient(120deg,#667eea,#764ba2);
      color: #222;
      padding: 20px;
    }

    .dark { background:#0f172a; color:#e5e7eb; }

    h1 { color:white; }

    .box {
      background:white;
      border-radius:12px;
      padding:25px;
      width:820px;
      box-shadow:0 15px 40px rgba(0,0,0,0.3);
      margin-bottom:20px;
    }

    button {
      background:#6366f1;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:8px;
      cursor:pointer;
      margin-top:8px;
    }

    input,select {
      padding:7px;
      border-radius:6px;
      border:1px solid #ccc;
      margin:4px 0;
      width:100%;
    }

    .progress {
      width:100%;
      height:16px;
      background:#e5e7eb;
      border-radius:10px;
      margin:10px 0;
    }

    #progressBar {
      height:100%;
      width:0%;
      background:#22c55e;
    }

    .admin-box{
      background:#f8fafc;
      border:2px dashed #6366f1;
      padding:15px;
      border-radius:10px;
    }

    .correct { color:green; font-weight:bold; }
    .wrong { color:red; font-weight:bold; }
  </style>

</head>
<body>

<h1>🧠 Smart Online Quiz</h1>
<button onclick="toggleDark()">🌙 Dark Mode</button>

<!-- QUIZ PANEL -->
<div class="box">

<h2>Start Quiz</h2>

<label>Name:</label>
<input type="text" id="username">

<label>Topic:</label>
<select id="topic">
  <option value="js">JavaScript</option>
  <option value="html">HTML</option>
  <option value="css">CSS</option>
  <option value="gk">General Knowledge</option>
  <option value="computer">Computer Fundamentals</option>
  <option value="mixed">Mixed</option>
</select>

<label>No. of Questions:</label>
<input type="number" id="numQ" value="5">

<label>Timer per Question:</label>
<input type="number" id="timerInput" value="15">

<button onclick="startQuiz()">Start Quiz</button>

<hr>

<p><b>Time Left:</b> <span id="time">0</span></p>

<div class="progress"><div id="progressBar"></div></div>

<div id="quizArea"></div>
<p id="feedback"></p>
<p id="result"></p>

</div>

<!-- ADMIN PANEL -->
<div class="box admin-box">

<h2>👨‍💼 Admin Panel — Add Question</h2>

<label>Select Topic:</label>
<select id="adminTopic">
  <option value="js">JavaScript</option>
  <option value="html">HTML</option>
  <option value="css">CSS</option>
  <option value="gk">General Knowledge</option>
  <option value="computer">Computer Fundamentals</option>
</select>

<label>Question:</label>
<input type="text" id="adminQuestion">

<label>Option 1:</label>
<input type="text" id="opt1">

<label>Option 2:</label>
<input type="text" id="opt2">

<label>Option 3:</label>
<input type="text" id="opt3">

<label>Option 4:</label>
<input type="text" id="opt4">

<label>Correct Answer:</label>
<input type="text" id="adminAnswer">

<button onclick="addQuestion()">Add Question</button>

<p id="adminMsg"></p>

</div>

<script>

/* DARK MODE */
function toggleDark(){
document.body.classList.toggle("dark");
}

/* DEFAULT QUESTIONS */
let questions = {
js:[
{q:"JavaScript is used for?",options:["Styling","Programming","Database","Server"],ans:"Programming"}
],
html:[
{q:"HTML stands for?",options:["Hyper Text Markup Language","None","Data","Home"],ans:"Hyper Text Markup Language"}
],
css:[],
gk:[],
computer:[]
};

/* LOAD ADMIN QUESTIONS FROM STORAGE */
function loadStoredQuestions(){
let stored = JSON.parse(localStorage.getItem("adminQuestions"));
if(stored){
for(let topic in stored){
questions[topic] = questions[topic].concat(stored[topic]);
}
}
}
loadStoredQuestions();

/* ADMIN ADD QUESTION */
function addQuestion(){

let topic = adminTopic.value;
let q = adminQuestion.value;
let o1 = opt1.value;
let o2 = opt2.value;
let o3 = opt3.value;
let o4 = opt4.value;
let ans = adminAnswer.value;

if(!q || !o1 || !o2 || !o3 || !o4 || !ans){
adminMsg.innerHTML="Fill all fields!";
return;
}

let newQ = {q:q, options:[o1,o2,o3,o4], ans:ans};

questions[topic].push(newQ);

/* SAVE TO LOCAL STORAGE */
let stored = JSON.parse(localStorage.getItem("adminQuestions")) || {};
stored[topic] = stored[topic] || [];
stored[topic].push(newQ);
localStorage.setItem("adminQuestions",JSON.stringify(stored));

adminMsg.innerHTML="Question added successfully!";
}

/* QUIZ VARIABLES */
let selectedQuestions=[],index=0,correct=0,wrong=0,skipped=0,timer,timeLeft;
const NEGATIVE=.25;

/* START QUIZ */
function startQuiz(){

if(username.value===""){alert("Enter your name");return;}

let num=parseInt(numQ.value);

let pool;

if(topic.value==="mixed"){
pool=[...questions.js,...questions.html,...questions.css,...questions.gk,...questions.computer];
}else{
pool=[...questions[topic.value]];
}

pool.sort(()=>Math.random()-0.5);
selectedQuestions=pool.slice(0,num);

index=0;correct=0;wrong=0;skipped=0;

showQuestion();
}

/* SHOW QUESTION */
function showQuestion(){

clearInterval(timer);
feedback.innerHTML="";
updateProgress();

if(index>=selectedQuestions.length){ finishQuiz(); return;}

let q=selectedQuestions[index];

quizArea.innerHTML=
`<h3>${index+1}. ${q.q}</h3>
${q.options.map(o=>`<div><input type="radio" name="ans" value="${o}"> ${o}</div>`).join("")}
<button onclick="checkAnswer()">Submit</button>`;

startTimer();
}

/* TIMER */
function startTimer(){
timeLeft=parseInt(timerInput.value);
time.innerText=timeLeft;

timer=setInterval(()=>{
timeLeft--;
time.innerText=timeLeft;
if(timeLeft<=0){
clearInterval(timer);
skipped++; index++; showQuestion();
}
},1000);
}

/* CHECK ANSWER */
function checkAnswer(){

clearInterval(timer);

let sel=document.querySelector('input[name="ans"]:checked');
if(!sel){alert("Select answer");return;}

let selectedValue=sel.value.trim().toLowerCase();
let correctValue=selectedQuestions[index].ans.trim().toLowerCase();

if(selectedValue===correctValue){
correct++;
feedback.innerHTML="<span class='correct'>Correct</span>";
}else{
wrong++;
feedback.innerHTML="<span class='wrong'>Wrong</span>";
}

index++;
setTimeout(showQuestion,600);
}

/* PROGRESS */
function updateProgress(){
progressBar.style.width=(index/selectedQuestions.length)*100+"%";
}

/* FINISH QUIZ */
function finishQuiz(){

quizArea.innerHTML="";
time.innerText="0";

let score=correct-(wrong*NEGATIVE);
if(score<0)score=0;

let accuracy=((correct/selectedQuestions.length)*100).toFixed(1);

result.innerHTML=
`<h2>Result</h2>
Correct: ${correct}<br>
Wrong: ${wrong}<br>
Skipped: ${skipped}<br>
Score: ${score}<br>
Accuracy: ${accuracy}%<br>
<button onclick="location.reload()">Restart</button>`;
}

</script>
</body>
</html>
