<!DOCTYPE html>
<html>
<head>
    <title>Live Currency Converter</title>
</head>
<body>

<h2>💱 Live Currency Converter</h2>

<input type="number" id="amount" placeholder="Enter amount">
<select id="from">
    <option value="USD">USD</option>
    <option value="INR">INR</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
</select>

<select id="to">
    <option value="USD">USD</option>
    <option value="INR">INR</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
</select>

<button onclick="convert()">Convert</button>

<p id="result"></p>

<script>
async function convert() {
    let amount = parseFloat(document.getElementById("amount").value);
    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;

    if (isNaN(amount)) {
        document.getElementById("result").innerText = "Please enter a valid amount!";
        return;
    }

    // Fetch live rate data
    let response = await fetch("https://cdn.moneyconvert.net/api/latest.json");
    let data = await response.json();

    // Get all rates relative to USD
    let rates = data.rates;

    // Convert from base to USD first and then to target
    let amountInUSD = amount / rates[from];
    let converted = amountInUSD * rates[to];

    document.getElementById("result").innerText =
        `${amount} ${from} = ${converted.toFixed(4)} ${to}`;
}
</script>

</body>
</html>
