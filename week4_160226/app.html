<!DOCTYPE html>
<html>
<head>
    <title>Advanced To-Do List</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        input, select, button {
            padding: 8px;
            margin: 5px;
        }
        li {
            margin: 5px 0;
            text-align: left;
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        .category {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>📝 To-Do List with Categories</h2>

<input type="text" id="taskInput" placeholder="Enter Task">
<select id="category">
    <option value="Work">Work</option>
    <option value="Home">Home</option>
    <option value="Study">Study</option>
</select>
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>

<script>
// Class for Task
class Task {
    constructor(name, category) {
        this.name = name;
        this.category = category;
        this.completed = false;
    }

    toggleStatus() {
        this.completed = !this.completed;
    }
}

// Array to store tasks
let tasks = [];

// Function to add task
function addTask() {
    let taskName = document.getElementById("taskInput").value.trim();
    let category = document.getElementById("category").value;

    if (taskName === "") {
        alert("Please enter a task!");
        return;
    }

    let task = new Task(taskName, category);
    tasks.push(task);
    displayTasks();

    document.getElementById("taskInput").value = "";
}

// Function to display tasks
function displayTasks() {
    let list = document.getElementById("taskList");
    list.innerHTML = "";

    for (let i = 0; i < tasks.length; i++) {
        let li = document.createElement("li");
        li.innerHTML = `<span class="category">[${tasks[i].category}]</span> ${tasks[i].name}`;

        if (tasks[i].completed) {
            li.classList.add("completed");
        }

        // Complete button
        let completeBtn = document.createElement("button");
        completeBtn.textContent = "✔";
        completeBtn.onclick = function() {
            tasks[i].toggleStatus();
            displayTasks();
        };

        // Delete button
        let deleteBtn = document.createElement("button");
        deleteBtn.textContent = "❌";
        deleteBtn.onclick = function() {
            tasks.splice(i, 1);
            displayTasks();
        };

        li.appendChild(completeBtn);
        li.appendChild(deleteBtn);
        list.appendChild(li);
    }
}
</script>

</body>
</html>
